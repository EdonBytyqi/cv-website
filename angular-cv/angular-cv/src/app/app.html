@let data = cvData();

<a class="skip-link" href="#main-content">Skip to content</a>

<app-site-header [site]="data.sidebar" />

<main id="main-content" tabindex="-1">
  <app-hero [aboutMe]="data.aboutMe" [currentJob]="currentJob()" />
  <app-about [aboutMe]="data.aboutMe" [location]="data.contact.location" />
  <app-experience [experiences]="data.experiences" />
  <app-education [education]="data.education" />
  <app-skills [categories]="data.skillCategories" />
  <app-contact [contact]="data.contact" />
</main>

<app-site-footer [name]="data.aboutMe.fullName" [socialLinks]="data.sidebar.socialLinks" />
