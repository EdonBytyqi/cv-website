name: Angular deploy

on:
  push:
    branches: [main]
    paths:
      - 'angular-cv/**'
      - '.github/workflows/angular-*.yml'
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deployment that is already running; queue the next one instead
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: angular-cv/angular-cv

jobs:
  build:
    name: Verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: angular-cv/angular-cv/.nvmrc
          cache: npm
          cache-dependency-path: angular-cv/angular-cv/package-lock.json

      - run: npm ci
      - run: npm run spec:check
      - run: npm test -- --watch=false

      - id: pages
        uses: actions/configure-pages@v6

      - name: Build for GitHub Pages
        run: npm run build -- --base-href "${{ steps.pages.outputs.base_path }}/"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: angular-cv/angular-cv/dist/angular-cv/browser

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
